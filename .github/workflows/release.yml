name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            jq \
            libasound2-dev \
            libclang-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: 1.97.1

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release tag must be a SemVer version prefixed with v" >&2
            exit 1
          fi

          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq --exit-status --raw-output \
                '.packages[] | select(.name == "talkdown") | .version'
          )"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "error: tag $RELEASE_TAG does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release archive
        run: |
          archive_stem="talkdown-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          staging_root="$(mktemp -d)"
          package_root="${staging_root}/${archive_stem}"

          install -D --mode=0755 \
            target/release/talkdown \
            "${package_root}/bin/talkdown"
          install -D --mode=0644 \
            packaging/linux/talkdown.desktop \
            "${package_root}/share/applications/talkdown.desktop"
          install -D --mode=0644 \
            assets/talkdown.svg \
            "${package_root}/share/icons/hicolor/scalable/apps/talkdown.svg"

          mkdir -p dist
          tar --create --gzip \
            --file "dist/${archive_stem}.tar.gz" \
            --directory "$staging_root" \
            "$archive_stem"
          (
            cd dist
            sha256sum "${archive_stem}.tar.gz" > "${archive_stem}.tar.gz.sha256"
          )

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_options=(
            --generate-notes
            --title "Talkdown ${RELEASE_TAG}"
            --verify-tag
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create \
            "$RELEASE_TAG" \
            dist/* \
            "${release_options[@]}"
