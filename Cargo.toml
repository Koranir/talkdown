[package]
name = "talkdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1.0"
cpal = { version = "0.17", optional = true }
crossbeam-channel = "0.5"
directories = "6.0"
harper-core = { version = "2.5", default-features = false }
iced = { git = "https://github.com/iced-rs/iced.git", rev = "9854bd32b5039a92549c7fe73509eb66a003e3bc", features = ["advanced", "highlighter", "tokio"] }
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1.0", features = ["fs"] }
ureq = "3.3"
whisper-rs = { version = "0.16", optional = true }

[features]
default = ["local-whisper"]
local-whisper = ["dep:cpal", "dep:whisper-rs"]
whisper-cuda = ["local-whisper", "whisper-rs/cuda"]
whisper-metal = ["local-whisper", "whisper-rs/metal"]
whisper-vulkan = ["local-whisper", "whisper-rs/vulkan"]

[dev-dependencies]
hound = "3.5"
iced_test = { git = "https://github.com/iced-rs/iced.git", rev = "9854bd32b5039a92549c7fe73509eb66a003e3bc" }

[profile.release]
lto = "thin"
codegen-units = 1
